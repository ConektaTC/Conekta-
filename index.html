<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Página Web</title>
    <style>
        /* Eliminamos los márgenes por defecto del navegador para que ocupe toda la hoja */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Evita barras de desplazamiento si la imagen es grande */
            background-color: #000; /* Color de fondo opcional por si la imagen no cubre todo (ej. negro o blanco) */
        }

        /* Ajustamos la imagen para que llene la hoja */
        img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Cambia a 'cover' si quieres que llene toda la pantalla recortando los bordes, o 'contain' para que se vea completa */
            display: block;
        }
    </style>
</head>
<body>
    <img src="suspendido.png" alt="Suspendido">
</body>
</html>
